name: dragonbane

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dragonbane}
      POSTGRES_USER: ${POSTGRES_USER:-dragonbane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres17_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3000}:3000"
    environment:
      PORT: 3000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      LOGIN_MAX_FAILURES_PER_ACCOUNT: ${LOGIN_MAX_FAILURES_PER_ACCOUNT:-10}
      LOGIN_MAX_FAILURES_PER_ADDRESS: ${LOGIN_MAX_FAILURES_PER_ADDRESS:-30}
      LOGIN_RATE_WINDOW_SECONDS: ${LOGIN_RATE_WINDOW_SECONDS:-900}
      DRACONI_HOST: ${DRACONI_HOST:-0.0.0.0}
      DATABASE_URL: postgresql://${POSTGRES_USER:-dragonbane}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}@db:5432/${POSTGRES_DB:-dragonbane}
      STORAGE_ROOT: /data/storage
      BACKUP_ROOT: /data/backups
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-25000000}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-40000000}
      MAX_BACKUP_BYTES: ${MAX_BACKUP_BYTES:-1073741824}
      SESSION_DAYS: ${SESSION_DAYS:-14}
      SESSION_TOUCH_INTERVAL_SECONDS: ${SESSION_TOUCH_INTERVAL_SECONDS:-300}
      AUTH_CONTEXT_CACHE_MS: ${AUTH_CONTEXT_CACHE_MS:-5000}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      DB_QUERY_TIMEOUT_MS: ${DB_QUERY_TIMEOUT_MS:-15000}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-15000}
      DB_SLOW_QUERY_MS: ${DB_SLOW_QUERY_MS:-500}
      SLOW_REQUEST_MS: ${SLOW_REQUEST_MS:-500}
      PERFORMANCE_SAMPLE_SIZE: ${PERFORMANCE_SAMPLE_SIZE:-1024}
      HOUSEKEEPING_INTERVAL_MINUTES: ${HOUSEKEEPING_INTERVAL_MINUTES:-360}
      EXPIRED_SESSION_RETENTION_HOURS: ${EXPIRED_SESSION_RETENTION_HOURS:-24}
      CHANGE_EVENT_RETENTION_DAYS: ${CHANGE_EVENT_RETENTION_DAYS:-14}
      HOUSEKEEPING_BATCH_SIZE: ${HOUSEKEEPING_BATCH_SIZE:-1000}
      HOUSEKEEPING_MAX_BATCHES: ${HOUSEKEEPING_MAX_BATCHES:-20}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env (copy .env.example)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      AUTH_MODE: ${AUTH_MODE:-development_token}
      DEVELOPMENT_TOKEN: ${DEVELOPMENT_TOKEN:-}
      DEVELOPMENT_USER_EMAIL: ${DEVELOPMENT_USER_EMAIL:-}
      HELPER_RATE_LIMIT_PER_MINUTE: ${HELPER_RATE_LIMIT_PER_MINUTE:-120}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      MCP_INTERNAL_API_BASE_URL: http://api:3000
      OAUTH_ACCESS_TOKEN_MINUTES: ${OAUTH_ACCESS_TOKEN_MINUTES:-60}
      OAUTH_REFRESH_TOKEN_DAYS: ${OAUTH_REFRESH_TOKEN_DAYS:-30}
    volumes:
      - storage_data:/data/storage
      - backup_data:/data/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  mcp:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MCP_PORT:-3100}:3100"
    environment:
      DRACONI_SERVICE: mcp
      MCP_PORT: 3100
      DRACONI_MCP_HOST: ${DRACONI_MCP_HOST:-0.0.0.0}
      API_BASE_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres17_data:
  storage_data:
  backup_data:
