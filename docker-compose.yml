name: dragonbane

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dragonbane}
      POSTGRES_USER: ${POSTGRES_USER:-dragonbane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dragonbane-local-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      PORT: 3000
      DRACONI_HOST: ${DRACONI_HOST:-0.0.0.0}
      DATABASE_URL: postgresql://${POSTGRES_USER:-dragonbane}:${POSTGRES_PASSWORD:-dragonbane-local-password}@db:5432/${POSTGRES_DB:-dragonbane}
      STORAGE_ROOT: /data/storage
      BACKUP_ROOT: /data/backups
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-25000000}
      MAX_BACKUP_BYTES: ${MAX_BACKUP_BYTES:-1073741824}
      SESSION_DAYS: ${SESSION_DAYS:-14}
      HOUSEKEEPING_INTERVAL_MINUTES: ${HOUSEKEEPING_INTERVAL_MINUTES:-360}
      EXPIRED_SESSION_RETENTION_HOURS: ${EXPIRED_SESSION_RETENTION_HOURS:-24}
      CHANGE_EVENT_RETENTION_DAYS: ${CHANGE_EVENT_RETENTION_DAYS:-14}
      HOUSEKEEPING_BATCH_SIZE: ${HOUSEKEEPING_BATCH_SIZE:-1000}
      HOUSEKEEPING_MAX_BATCHES: ${HOUSEKEEPING_MAX_BATCHES:-20}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      AUTH_MODE: ${AUTH_MODE:-development_token}
      DEVELOPMENT_TOKEN: ${DEVELOPMENT_TOKEN:-}
      DEVELOPMENT_USER_EMAIL: ${DEVELOPMENT_USER_EMAIL:-}
      HELPER_RATE_LIMIT_PER_MINUTE: ${HELPER_RATE_LIMIT_PER_MINUTE:-120}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      MCP_INTERNAL_API_BASE_URL: http://api:3000
      OAUTH_ACCESS_TOKEN_MINUTES: ${OAUTH_ACCESS_TOKEN_MINUTES:-60}
      OAUTH_REFRESH_TOKEN_DAYS: ${OAUTH_REFRESH_TOKEN_DAYS:-30}
    volumes:
      - storage_data:/data/storage
      - backup_data:/data/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  mcp:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-3100}:3100"
    environment:
      DRACONI_SERVICE: mcp
      MCP_PORT: 3100
      DRACONI_MCP_HOST: ${DRACONI_MCP_HOST:-0.0.0.0}
      API_BASE_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  storage_data:
  backup_data:
